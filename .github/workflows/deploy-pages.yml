name: Build and deploy Godot game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and Web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-tools
            ~/.local/share/godot/export_templates/4.6.3.stable
          key: godot-4.6.3-linux-web-v1
      - name: Install tested Godot version
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-tools "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d .godot-tools
          chmod +x .godot-tools/Godot_v4.6.3-stable_linux.x86_64
          touch .godot-tools/.gdignore
          curl -fL --retry 3 -o "$RUNNER_TEMP/templates.tpz" https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/web*.zip' -d "$HOME/.local/share/godot/export_templates/4.6.3.stable"
          rm "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/templates.tpz"
      - name: Import and validate the game
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$GITHUB_WORKSPACE/.godot-tools/Godot_v4.6.3-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E 'SCRIPT ERROR:|Failed to load script|Parse Error:' "$RUNNER_TEMP/import.log"
          "$GODOT" --headless --audio-driver Dummy --path . --script res://Tests/ReferenceFlowSmoke.gd 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          ! grep -E 'SCRIPT ERROR:|Assertion failed|Failed to load script' "$RUNNER_TEMP/smoke.log"
          grep -q 'REFERENCE_FLOW_OK' "$RUNNER_TEMP/smoke.log"
      - name: Export Web build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web
          build_name="game-${GITHUB_SHA:0:12}"
          .godot-tools/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --export-release Web "web/${build_name}.html" 2>&1 | tee "$RUNNER_TEMP/export.log"
          ! grep -E 'SCRIPT ERROR:|Failed to load script|Export failed' "$RUNNER_TEMP/export.log"
          test -s "web/${build_name}.html"
          test -s "web/${build_name}.wasm"
          test -s "web/${build_name}.pck"
          mv "web/${build_name}.html" web/index.html
          touch web/.nojekyll
          python3 -c 'import json,os;json.dump({"commit":os.environ["GITHUB_SHA"]},open("web/build.json","w"))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
