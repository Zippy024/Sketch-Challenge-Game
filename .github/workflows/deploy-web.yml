name: Build and deploy Godot Web Game

on:
  push:
    branches: [main]
    paths-ignore:
      - '.godot/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project assets
        run: godot --headless --editor --path . --import --quit

      - name: Verify three languages and original stage behavior
        run: |
          timeout 90s godot --headless --audio-driver Dummy --path . --script res://Tests/TrilingualSmoke.gd --max-fps 120 --quit-after 9000 2>&1 | tee /tmp/trilingual-smoke.log
          grep -q "TRILINGUAL_SMOKE_OK" /tmp/trilingual-smoke.log
          if grep -q "SCRIPT ERROR" /tmp/trilingual-smoke.log; then exit 1; fi

      - name: Verify Start Game and saved Continue flow
        run: |
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://Tests/SessionFlow.gd --max-fps 120 --quit-after 6000 2>&1 | tee /tmp/session-flow.log
          grep -q "SESSION_FLOW_OK" /tmp/session-flow.log
          if grep -q "SCRIPT ERROR" /tmp/session-flow.log; then exit 1; fi

      - name: Verify dialogue finishes before completion
        run: |
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://Tests/CompletionTiming.gd --max-fps 120 --quit-after 6000 2>&1 | tee /tmp/completion-timing.log
          grep -q "COMPLETION_TIMING_OK" /tmp/completion-timing.log
          if grep -q "SCRIPT ERROR" /tmp/completion-timing.log; then exit 1; fi

      - name: Export Web game
        run: |
          mkdir -p "Web Game"
          build_name="game-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-release Web "Web Game/${build_name}.html"
          mv "Web Game/${build_name}.html" "Web Game/index.html"
          mkdir -p "Web Game/assets"
          cp "LoadingAssets/BlueKitchen.png" "Web Game/assets/loading-kitchen.png"
          cp "LoadingAssets/KitchenLogo.webp" "Web Game/assets/game-logo.webp"
          test -s "Web Game/assets/loading-kitchen.png"
          test -s "Web Game/assets/game-logo.webp"
          test -s "Web Game/index.html"
          python3 -c 'import json,os;json.dump({"commit":os.environ["GITHUB_SHA"]},open("Web Game/build.json","w"))'
          test -n "$(find 'Web Game' -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find 'Web Game' -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Web Game"

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
