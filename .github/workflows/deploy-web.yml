name: Build and deploy Godot Web Game

on:
  push:
    branches: [main]
    paths-ignore:
      - '.godot/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout Godot source
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project assets
        run: godot --headless --editor --path . --import --quit

      - name: Verify three languages and original stage behavior
        run: |
          timeout 120s godot --headless --audio-driver Dummy --path . --script res://Tests/TrilingualSmoke.gd --max-fps 120 --quit-after 14400 2>&1 | tee /tmp/trilingual-smoke.log
          grep -q "TRILINGUAL_SMOKE_OK" /tmp/trilingual-smoke.log
          if grep -q "SCRIPT ERROR" /tmp/trilingual-smoke.log; then exit 1; fi

      - name: Verify Start Game and saved Continue flow
        run: |
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://Tests/SessionFlow.gd --max-fps 120 --quit-after 6000 2>&1 | tee /tmp/session-flow.log
          grep -q "SESSION_FLOW_OK" /tmp/session-flow.log
          if grep -q "SCRIPT ERROR" /tmp/session-flow.log; then exit 1; fi

      - name: Verify dialogue finishes before completion
        run: |
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://Tests/CompletionTiming.gd --max-fps 120 --quit-after 6000 2>&1 | tee /tmp/completion-timing.log
          grep -q "COMPLETION_TIMING_OK" /tmp/completion-timing.log
          if grep -q "SCRIPT ERROR" /tmp/completion-timing.log; then exit 1; fi

      - name: Verify recorded Stage 3 questions and speech controls
        run: |
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://Tests/Stage3Speech.gd --max-fps 120 --quit-after 6000 2>&1 | tee /tmp/stage3-speech.log
          grep -q "STAGE3_SPEECH_OK" /tmp/stage3-speech.log
          if grep -q "SCRIPT ERROR" /tmp/stage3-speech.log; then exit 1; fi

      - name: Verify direct selection of eight 3D components
        run: |
          timeout 30s godot --headless --audio-driver Dummy --path . --script res://Tests/DirectKitchenParts.gd --max-fps 120 --quit-after 3000 2>&1 | tee /tmp/direct-kitchen.log
          grep -q "DIRECT_KITCHEN_PARTS_OK" /tmp/direct-kitchen.log
          if grep -q "SCRIPT ERROR" /tmp/direct-kitchen.log; then exit 1; fi

      - name: Verify Stage 4 selection and customer/reference layout
        run: |
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://Tests/Stage4Selection.gd --max-fps 120 --quit-after 7200 2>&1 | tee /tmp/stage4-selection.log
          grep -q "STAGE4_SELECTION_OK" /tmp/stage4-selection.log
          if grep -q "SCRIPT ERROR" /tmp/stage4-selection.log; then exit 1; fi

      - name: Verify compact header and stage card navigation
        run: |
          timeout 120s godot --headless --audio-driver Dummy --path . --script res://Tests/HeaderNavigation.gd --max-fps 120 --quit-after 14400 2>&1 | tee /tmp/header-navigation.log
          grep -q "HEADER_NAVIGATION_OK" /tmp/header-navigation.log
          if grep -q "SCRIPT ERROR" /tmp/header-navigation.log; then exit 1; fi

      - name: Export Web game
        run: |
          mkdir -p "Web Game"
          build_name="game-${GITHUB_SHA:0:12}"
          godot --headless --path . --export-release Web "Web Game/${build_name}.html"
          mv "Web Game/${build_name}.html" "Web Game/index.html"
          mkdir -p "Web Game/assets"
          cp "LoadingAssets/TealKitchen.webp" "Web Game/assets/loading-kitchen.webp"
          # The owner can upload the two paintings after the code change.
          if [ -s "LoadingAssets/AquaBuilder.png" ]; then
            cp "LoadingAssets/AquaBuilder.png" "Web Game/assets/loading-kitchen.png"
            sed -i 's/loading-kitchen.webp/loading-kitchen.png/g' "Web Game/index.html"
          fi
          cp "LoadingAssets/KitchenLogo.webp" "Web Game/assets/game-logo.webp"
          test -s "Web Game/assets/loading-kitchen.webp"
          test -s "Web Game/assets/game-logo.webp"
          test -s "Web Game/index.html"
          python3 -c 'import json,os;json.dump({"commit":os.environ["GITHUB_SHA"]},open("Web Game/build.json","w"))'
          test -n "$(find 'Web Game' -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find 'Web Game' -maxdepth 1 -name '*.pck' -print -quit)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Web Game"
          name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            for (let attempt = 0; attempt < 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo,
                run_id: context.runId,
                per_page: 100,
              });
              const matches = artifacts.filter(artifact => artifact.name === name && !artifact.expired);
              if (matches.length === 1) {
                core.info(`Pages artifact ${matches[0].id} is available`);
                return;
              }
              if (matches.length > 1) throw new Error(`Duplicate Pages artifact: ${name}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error(`Pages artifact metadata is not available: ${name}`);

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
