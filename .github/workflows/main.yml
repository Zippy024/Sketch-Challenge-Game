
name: Deploy Godot Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q Godot_v4.7.2-stable_export_templates.tpz -d templates
          cp templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Import Godot Project
        run: |
          godot --headless --editor --path . --import 2>&1 | tee import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' import.log; then
            echo "Godot script import failed"
            exit 1
          fi

      - name: Check game startup and scripts
        run: |
          godot --headless --path . --quit-after 75 2>&1 | tee startup.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call\.|Invalid get index|Invalid set index' startup.log; then
            echo "Godot game startup failed"
            exit 1
          fi

      - name: Export Web Game
        run: |
          mkdir -p web
          godot --headless --path . --export-release "Web" web/index.html 2>&1 | tee export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' export.log; then
            echo "Godot Web export contains errors"
            exit 1
          fi
          test -s web/index.html
          test -s web/index.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
