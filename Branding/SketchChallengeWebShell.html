<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b3159">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <!-- Inline branded favicon also avoids stale GitHub Pages icon caches. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%23f1fbff%22%2F%3E%3Cpath%20d%3D%22M9%2012h41v9H20v22h27V29h10v24H9zM20%2021v12h14%22%20fill%3D%22none%22%20stroke%3D%22%230876b9%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22m38%2051%2017-20%205%205-18%2020-8%203z%22%20fill%3D%22%23b9f4ff%22%20stroke%3D%22%2300a7dc%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #211c34; }
    #canvas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #sketch-loading {
      position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
      padding: 24px; background: #f4f0e8; isolation: isolate;
      transition: opacity 380ms ease, visibility 380ms ease;
    }
    #sketch-loading::before {
      content: ''; position: absolute; inset: 0; z-index: -2;
      background: linear-gradient(130deg, #a2d3f3 0%, #d8effb 48%, #f4fbff 100%);
    }
    #sketch-loading::after {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(90deg, rgba(252,249,241,.93) 0%, rgba(251,247,239,.84) 43%, rgba(18,54,42,.26) 100%);
    }
    #sketch-loading.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-card {
      width: min(520px, 96vw); margin-right: auto; margin-left: max(4vw, calc((100vw - 1200px)/2));
      padding: clamp(26px,4vw,48px); border: 1px solid rgba(255,255,255,.55);
      border-radius: 28px; background: rgba(255,255,255,.72);
      box-shadow: 0 20px 60px rgba(29,37,33,.11); backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .brand-row { display: flex; gap: 20px; align-items: center; }
    .logo { width: clamp(70px,10vw,104px); height: auto; flex: none; filter: drop-shadow(0 4px 7px rgba(4,72,57,.13)); }
    .eyebrow { text-transform: uppercase; font-size: 12px; font-weight: 750; color: #18715c; letter-spacing: .15em; }
    h1 { margin: 6px 0 0; color: #10342f; font-size: clamp(29px,4vw,43px); line-height: 1.13; letter-spacing: -.035em; }
    .subtitle { color: #53706b; margin: 20px 0 34px; font-size: 17px; }
    .progress-track { width: 100%; height: 9px; border-radius: 999px; background: #dce8e2; overflow: hidden; }
    .progress-bar { width: 4%; height: 100%; background: linear-gradient(90deg,#007c5e,#38af81); border-radius: inherit; transition: width 120ms ease; }
    .load-row { display: flex; gap: 15px; justify-content: space-between; align-items: center; margin-top: 13px; }
    #status-text { color: #42615b; font-size: 14px; }
    #status-pct { color: #11624e; font-size: 14px; font-weight: 750; }
    .foot { font-size: 12px; color: #6d8781; margin-top: 30px; letter-spacing: .04em; }
    @media(max-width: 700px) {
      #sketch-loading::after { background: rgba(252,249,241,.72); }
      .splash-card { margin: 0 auto; }
    }
    @media(prefers-reduced-motion: reduce) { .progress-bar, #sketch-loading { transition: none; } }
  
    /* First-frame browser loader matches the blue Godot intro and language scene. */
    html, body { background: #e2f2ff; }
    #sketch-loading { background: #e1f2ff; }
    #sketch-loading::before { filter: saturate(.58) hue-rotate(172deg) brightness(1.15); opacity: .67; }
    #sketch-loading::after { background: linear-gradient(105deg,rgba(222,242,255,.35),rgba(239,250,255,.20)); }
    .splash-card { background: rgba(247,252,255,.92); border-color: rgba(146,202,243,.82); box-shadow: 0 20px 70px rgba(27,82,140,.17); }
    .eyebrow { color: #357aab; }
    h1 { color: #22568e; text-shadow: 0 3px 0 rgba(235,249,255,.9); }
    .subtitle, .foot { color: #47739a; }
    .progress-track { background: #bad9f1; border-color: #8cbbe0; }
    .progress-bar { background: linear-gradient(90deg,#3185c8,#8acfff); }
    .load-row { color: #28618d; }
    .logo { filter: drop-shadow(0 5px 8px rgba(26,103,180,.13)); }

  
    /* Full-view cinematic intro: isometric blueprint kitchen + real file loader. */
    #sketch-loading { padding: 12px; }
    #sketch-loading::before { filter: saturate(.55) hue-rotate(172deg) brightness(1.3) blur(3px); opacity: .37; }
    .splash-card {
      width: min(1180px, 96vw); max-width: none; height: min(820px, 97vh);
      border: 0; border-radius: 22px; box-shadow: none;
      background: rgba(235,247,255,.50); backdrop-filter: blur(5px);
      display:flex; flex-direction:column; align-items:center; justify-content: flex-start;
      padding: clamp(12px,2vh,26px) 20px;
    }
    .brand-row { display:flex; justify-content:center; text-align:center; width:100%; }
    .brand-row .logo { width: 62px; }
    .brand-row h1 { font-size: clamp(28px,4.5vw,55px); line-height:1.1; text-shadow: 0 3px 0 #fff, 0 7px 16px #80b4da; }
    .subtitle { margin: 6px 0 0; font-size:15px; }
    .intro-kitchen-art { flex:1; min-height:0; width: min(900px,96%); display:flex; align-items:center; justify-content:center; }
    .intro-kitchen-art svg { width:100%; height:100%; max-height:440px; overflow:visible; animation: introKitchenFloat 3.5s ease-in-out infinite; filter: drop-shadow(0 16px 25px rgba(54,120,186,.16)); }
    .progress-track { width: min(465px,83vw); min-height:16px; margin: 6px auto 6px; }
    .load-row { width:min(465px,83vw); font-size:14px; }
    .foot { margin-top:12px; }
    @keyframes introKitchenFloat { 0%,100% { transform:translateY(1px); } 50% { transform:translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .intro-kitchen-art svg { animation:none; } }

  
    /* Unified blueprint interface, including the browser's first loading frame. */
    html,body { background:#0a3159; }
    #sketch-loading {
      background: linear-gradient(145deg, #123c69 0%, #b0ddf8 54%, #e9faff 100%);
      color:#0c4476;
    }
    #sketch-loading::before { opacity:.23; filter:hue-rotate(165deg) saturate(.7) blur(5px); }
    #sketch-loading::after { background:linear-gradient(125deg,rgba(8,54,97,.04),rgba(223,249,255,.25)); }
    .splash-card {
      background:rgba(233,249,255,.87);
      border:2px solid rgba(144,224,255,.75);
      box-shadow:0 18px 56px rgba(9,47,93,.25);
    }
    .brand-row h1 { color:#0a5488; text-shadow:0 3px 0 rgba(252,255,255,.9); }
    .eyebrow,.subtitle,.foot,.load-row { color:#1b5687; }
    .progress-track { border-color:#8adfff; background:#c1e6f9; }
    .progress-bar { background:linear-gradient(90deg,#1180cb,#17cce9,#a0f5ff); }
    .intro-kitchen-art svg { filter:drop-shadow(0 18px 25px rgba(21,91,160,.22)); }
    @media(max-height:650px) { .splash-card { height:95vh; } .intro-kitchen-art svg { max-height:300px; } }

  
    /* 2026-11-09 final entry: NO photographic background images.
       Flat blue-ice game style matches native Godot Language/Main Menu. */
    html, body { background:#c7e9fb; }
    #sketch-loading {
      background: linear-gradient(135deg, #98cdef 0%, #cfebfa 49%, #f4fbff 100%);
    }
    #sketch-loading::before {
      background: radial-gradient(ellipse at 72% 23%, rgba(255,255,255,.55), transparent 55%);
      opacity:1; filter:none;
    }
    #sketch-loading::after {
      background: linear-gradient(to bottom, transparent 77%, rgba(108,188,232,.17));
    }
    .splash-card {
      background:rgba(239,250,255,.88);
      border:1.5px solid #afe2f9;
      box-shadow:0 20px 65px rgba(18,77,126,.14);
    }
    .intro-kitchen-art svg { filter:drop-shadow(0 12px 22px rgba(24,116,170,.15)); }
    .brand-row h1 { color:#0b6092; }
    .progress-bar { background:linear-gradient(90deg,#087eb9,#08bfe2,#b3f2ff); }

  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Your browser needs canvas support to run Sketch Challenge.</canvas>
  <div id="sketch-loading" role="status" aria-live="polite" aria-label="Game loading">
    <section class="splash-card">
      <div class="brand-row">
        <svg class="logo" viewBox="0 0 114 114" role="img" aria-label="Architectural floor plan and pencil logo" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="106" height="106" rx="23" fill="#eaf8ff" stroke="#3f9bdd" stroke-width="4"/><path d="M21 24h68v14H42v36h42V57h13v34H21V24z" fill="none" stroke="#2375b2" stroke-width="5" stroke-linejoin="round"/><path d="M62 89 93 55l8 8-30 35-15 4z" fill="#fff" stroke="#347cb6" stroke-width="3"/><path d="m93 55 4-5 9 8-5 5" fill="#f6c67b"/></svg>
        <div><div class="eyebrow">Kitchen Design Training</div><h1>Kitchen<br>Decoration Game</h1></div>
      </div>

      <div class="progress-track"><div class="progress-bar" id="sketch-bar"></div></div>
      <div class="load-row"><span id="status-text">Preparing your design adventure...</span><span id="status-pct">Loading</span></div>
      <div class="foot">日本語 &nbsp; / &nbsp; မြန်မာ &nbsp; · &nbsp; DESIGN TRAINING GAME</div>
    </section>
  </div>
  <noscript>Enable JavaScript to play Sketch Challenge.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    'use strict';
    (function () {
      const splash = document.getElementById('sketch-loading');
      const bar = document.getElementById('sketch-bar');
      const percent = document.getElementById('status-pct');
      const status = document.getElementById('status-text');
      let lastProgress = 0;
      const engine = new Engine($GODOT_CONFIG);
      function setProgress(current, total) {
        if (total > 0) {
          const value = Math.min(100, Math.max(lastProgress, Math.round(current * 100 / total)));
          lastProgress = value;
          bar.style.width = value + '%';
          percent.textContent = value + '%';
          status.textContent = value < 98 ? 'Loading game files...' : 'Starting the game...';
        } else {
          // Godot may report unknown length during WebAssembly initialization.
          status.textContent = 'Preparing your kitchen...';
          percent.textContent = 'Loading';
        }
      }
      function showError(error) {
        console.error('Sketch Challenge failed to load:', error);
        status.textContent = 'Unable to start. Refresh the page or open the browser console.';
        percent.textContent = 'Error';
        bar.style.width = '100%';
        bar.style.background = '#b34e4e';
      }
      // A resolved WebAssembly promise is NOT proof that Godot rendered a menu.
      // Keep the branded splash until GameMenu.gd explicitly reports readiness.
      window.__sketchSceneReady = false;
      const browserErrors = [];
      window.addEventListener('error', function (event) {
        const detail = event.message || 'Browser script error';
        browserErrors.push(detail);
        console.error('Sketch Challenge browser error:', detail);
      });
      window.addEventListener('unhandledrejection', function (event) {
        const detail = String(event.reason || 'Unhandled game promise');
        browserErrors.push(detail);
        console.error('Sketch Challenge rejected promise:', detail);
      });
      const startedAt = Date.now();
      let completed = false;
      function revealGame() {
        if (completed) return;
        completed = true;
        bar.style.width = '100%';
        percent.textContent = 'Ready';
        splash.classList.add('hide');
        window.setTimeout(() => splash.remove(), 450);
      }
      function waitForScene() {
        if (window.__sketchSceneReady === true) {
          // Wait a couple of frames to allow the canvas to present the scene.
          requestAnimationFrame(() => requestAnimationFrame(revealGame));
          return;
        }
        if (Date.now() - startedAt > 25000) {
          const detail = browserErrors.slice(-2).join(' | ');
          showError('Game scene did not start within 25 seconds.' + (detail ? ' ' + detail : ' Check WebGL and the browser console.'));
          status.textContent = 'The game could not open. Please refresh or try another browser.';
          return;
        }
        window.setTimeout(waitForScene, 200);
      }
      engine.startGame({canvas: document.getElementById('canvas'), onProgress: setProgress})
        .then(() => {
          percent.textContent = 'Starting';
          status.textContent = 'Opening game menu...';
          waitForScene();
        })
        .catch(showError);
    })();
  </script>
</body>
</html>
