<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7e2e9"><title>$GODOT_PROJECT_NAME</title>
$GODOT_HEAD_INCLUDE
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#154c50;font-family:system-ui,sans-serif;color:white}
#canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
#sketch-loading{position:fixed;inset:0;z-index:10000;overflow:hidden;background:linear-gradient(#073d3d08,#164c4020),url("assets/loading-kitchen.webp?v=$GODOT_URL") center/cover;transition:opacity .35s,visibility .35s;border:1px solid #d6fff1}
#sketch-loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.loading-logo{position:absolute;top:1.8%;left:50%;transform:translateX(-50%);width:min(47vw,530px);height:31%;object-fit:contain;filter:drop-shadow(0 6px 10px #083e4840);animation:logo-float 6s ease-in-out infinite}
.loading-ring{position:absolute;left:50%;top:78%;transform:translate(-50%,0);width:72%;height:18%;border:2px solid #d3fff0;border-radius:50%;box-shadow:0 0 10px 4px #43d7b74d,inset 0 0 12px #8cf4d9;mask-image:linear-gradient(to bottom,transparent 42%,black 56%);margin-top:-9vh;animation:ring-glow 3.6s ease-in-out infinite}
.loading-sparks{position:absolute;inset:0;pointer-events:none}.loading-sparks i{position:absolute;width:4px;height:4px;border-radius:50%;background:#edfff5;box-shadow:0 0 8px #d4fff1;animation:spark-rise 6s ease-in-out infinite;animation-delay:calc(var(--n)*-.7s);left:calc(14% + var(--n)*7.2%);top:calc(30% + var(--n)*3.7%)}
.loading-footer{position:absolute;top:89%;left:50%;transform:translateX(-50%);width:min(48vw,560px);text-align:center}
.progress-track{height:12px;border-radius:8px;background:#245b60;border:1px solid #d8ffef;overflow:hidden}
.progress-bar{height:100%;width:0;border-radius:8px;background:linear-gradient(#cefff3,#29b8a9)}
#status-pct{display:inline-block;margin-top:16px;padding:5px 18px;border-radius:18px;background:#073e43ba;font-size:16px;font-weight:600;text-shadow:0 1px 3px #123e43}
.loading-tagline,.loading-tip,#status-text{display:none}#sketch-loading.failed #status-text{display:block;margin-top:8px}
@media(max-width:600px){.loading-logo{width:75vw;height:29%}.loading-footer{width:74vw}}
@keyframes logo-float{50%{transform:translate(-50%,-5px)}}@keyframes ring-glow{50%{opacity:.65;filter:brightness(1.15)}}@keyframes spark-rise{0%,100%{opacity:0;transform:translateY(8px)}45%{opacity:.55}90%{opacity:0;transform:translateY(-30px)}}
@media(prefers-reduced-motion:reduce){#sketch-loading,.progress-bar{transition:none}.loading-logo,.loading-ring,.loading-sparks i{animation:none}.loading-sparks{display:none}}
</style></head><body>
<canvas id="canvas" tabindex="0">A browser with WebGL is required.</canvas>
<div id="sketch-loading" role="status" aria-live="polite" aria-label="Loading Kitchen Decoration Game">
<img class="loading-logo" src="assets/game-logo.webp?v=$GODOT_URL" alt="Kitchen Decoration Game">
<div class="loading-sparks" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i><i style="--n:9"></i></div>
<div class="loading-ring" aria-hidden="true"></div><p class="loading-tagline">Design a kitchen. Build your confidence.</p>
<div class="loading-footer"><div class="progress-track"><div class="progress-bar" id="sketch-bar"></div></div><span id="status-pct">Loading... 0%</span><span id="status-text"></span><p class="loading-tip">Read the plan. Understand the space. Make it yours.</p></div>
</div><noscript>Enable JavaScript to play.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    'use strict';
    (function () {
      const splash = document.getElementById('sketch-loading');
      const bar = document.getElementById('sketch-bar');
      const percent = document.getElementById('status-pct');
      const status = document.getElementById('status-text');
      let lastProgress = 0;
      const loadingPrefix = 'Loading... ';
      percent.textContent = loadingPrefix + '0%';
      const engine = new Engine($GODOT_CONFIG);
      function setProgress(current, total) {
        if (total > 0) {
          const value = Math.min(100, Math.max(lastProgress, Math.round(current * 100 / total)));
          lastProgress = value;
          bar.style.width = value + '%';
          percent.textContent = loadingPrefix + value + '%';
          status.textContent = value < 98 ? 'Loading game files...' : 'Starting the game...';
        } else {
          // Godot may report unknown length during WebAssembly initialization.
          status.textContent = 'Preparing your kitchen...';
          percent.textContent = loadingPrefix;
        }
      }
      function showError(error) {
        splash.classList.add('failed');
        console.error('Sketch Challenge failed to load:', error);
        status.textContent = 'Unable to start. Refresh the page or open the browser console.';
        percent.textContent = 'Error';
        bar.style.width = '100%';
        bar.style.background = '#b34e4e';
      }
      window.__kitchenMenuReady = false;
      const startedAt = Date.now();
      function revealWhenReady() {
        if (!window.__kitchenMenuReady) {
          if (Date.now() - startedAt > 90000) { showError('Menu did not start'); return; }
          setTimeout(revealWhenReady, 100);
          return;
        }
        requestAnimationFrame(() => requestAnimationFrame(() => {
          bar.style.width = '100%';
          percent.textContent = loadingPrefix + '100%';
          splash.classList.add('hide');
          setTimeout(() => splash.remove(), 450);
        }));
      }
      engine.startGame({canvas: document.getElementById('canvas'), onProgress: setProgress})
        .then(revealWhenReady)
        .catch(showError);
    })();
  </script>
</body>
</html>
