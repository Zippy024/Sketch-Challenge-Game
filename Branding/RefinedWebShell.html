<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c7e2e9"><title>$GODOT_PROJECT_NAME</title>
$GODOT_HEAD_INCLUDE
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c7e2e9;font-family:system-ui,sans-serif;color:#102e50}
#canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
#sketch-loading{position:fixed;inset:0;z-index:10000;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .35s,visibility .35s}
#sketch-loading::before{content:"";position:absolute;inset:-16px;background:linear-gradient(#d4edf06e,#d4edf06e),url("assets/loading-kitchen.png") center/cover;filter:blur(7px);z-index:-1}
#sketch-loading.hide{opacity:0;visibility:hidden;pointer-events:none}
.loading-logo{width:min(560px,75vw);height:245px;object-fit:contain;filter:drop-shadow(0 6px 8px #12507826)}
.loading-tagline{font-size:22px;font-weight:600;text-align:center;margin:22px 18px 60px}
.loading-footer{width:min(560px,78vw);text-align:center}
.progress-track{height:12px;border-radius:10px;background:#d6e7ec;border:1px solid white;overflow:hidden}
.progress-bar{height:100%;width:0;border-radius:10px;background:#008f98;transition:width .12s}
#status-pct{display:block;margin-top:22px;font-size:16px}
.loading-tip{font-size:14px;color:#526d82;margin-top:22px}
#status-text{display:none}#sketch-loading.failed #status-text{display:block;margin-top:8px}
@media(max-width:600px){.loading-logo{height:180px}.loading-tagline{font-size:18px;margin-bottom:40px}.loading-tip{font-size:12px}}
@media(prefers-reduced-motion:reduce){#sketch-loading,.progress-bar{transition:none}}
</style></head><body>
<canvas id="canvas" tabindex="0">A browser with WebGL is required.</canvas>
<div id="sketch-loading" role="status" aria-live="polite" aria-label="Loading Kitchen Decoration Game">
<img class="loading-logo" src="assets/game-logo.webp" alt="Kitchen Decoration Game">
<p class="loading-tagline">Design a kitchen. Build your confidence.</p>
<div class="loading-footer"><div class="progress-track"><div class="progress-bar" id="sketch-bar"></div></div><span id="status-pct">Loading... 0%</span><span id="status-text"></span><p class="loading-tip">Read the plan. Understand the space. Make it yours.</p></div>
</div><noscript>Enable JavaScript to play.</noscript>
  <script src="$GODOT_URL"></script>
  <script>
    'use strict';
    (function () {
      const splash = document.getElementById('sketch-loading');
      const bar = document.getElementById('sketch-bar');
      const percent = document.getElementById('status-pct');
      const status = document.getElementById('status-text');
      let lastProgress = 0;
      const loadingPrefix = 'Loading... ';
      percent.textContent = loadingPrefix + '0%';
      const engine = new Engine($GODOT_CONFIG);
      function setProgress(current, total) {
        if (total > 0) {
          const value = Math.min(100, Math.max(lastProgress, Math.round(current * 100 / total)));
          lastProgress = value;
          bar.style.width = value + '%';
          percent.textContent = loadingPrefix + value + '%';
          status.textContent = value < 98 ? 'Loading game files...' : 'Starting the game...';
        } else {
          // Godot may report unknown length during WebAssembly initialization.
          status.textContent = 'Preparing your kitchen...';
          percent.textContent = loadingPrefix;
        }
      }
      function showError(error) {
        splash.classList.add('failed');
        console.error('Sketch Challenge failed to load:', error);
        status.textContent = 'Unable to start. Refresh the page or open the browser console.';
        percent.textContent = 'Error';
        bar.style.width = '100%';
        bar.style.background = '#b34e4e';
      }
      window.__kitchenMenuReady = false;
      const startedAt = Date.now();
      function revealWhenReady() {
        if (!window.__kitchenMenuReady) {
          if (Date.now() - startedAt > 90000) { showError('Menu did not start'); return; }
          setTimeout(revealWhenReady, 100);
          return;
        }
        requestAnimationFrame(() => requestAnimationFrame(() => {
          bar.style.width = '100%';
          percent.textContent = loadingPrefix + '100%';
          splash.classList.add('hide');
          setTimeout(() => splash.remove(), 450);
        }));
      }
      engine.startGame({canvas: document.getElementById('canvas'), onProgress: setProgress})
        .then(revealWhenReady)
        .catch(showError);
    })();
  </script>
</body>
</html>
